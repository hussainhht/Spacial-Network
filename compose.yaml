services:
  backend:
    build:
      context: ./backend
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: "8080"
    volumes:
      - backend-data:/app/data

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_BACKEND_ORIGIN: http://localhost:8080
        NEXT_PUBLIC_BACKEND_WS_ORIGIN: ws://localhost:8080
        NEXT_IMAGE_UNOPTIMIZED: "true"
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  backend-data:
