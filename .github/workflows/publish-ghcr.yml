
name: Publish Docker Images to GHCR

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  validate:
    name: Validate production configuration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate Docker Compose
        run: |
          cp .env.production.example .env.production
          docker compose \
            --env-file .env.production \
            -f compose.prod.yaml \
            config --quiet

      - name: Validate Nginx configuration
        run: |
          docker run --rm \
            --add-host=backend:127.0.0.1 \
            --add-host=frontend:127.0.0.1 \
            -v "$PWD/deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v "$PWD/deploy/nginx/proxy.conf:/etc/nginx/proxy.conf:ro" \
            --entrypoint nginx \
            nginx:stable-alpine -t

  publish:
    name: Build and publish Docker images
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with Git LFS
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Verify 3D model assets
        run: |
          python3 - <<'PY'
          from pathlib import Path

          model_dir = Path("frontend/public/models")
          models = list(model_dir.rglob("*.glb"))

          if not models:
              raise SystemExit("ERROR: No GLB models found!")

          print(f"Found {len(models)} GLB files")

          for model in models:
              with model.open("rb") as f:
                  header = f.read(4)

              if header != b"glTF":
                  raise SystemExit(
                      f"ERROR: Invalid GLB or Git LFS pointer: {model}"
                  )

              size = model.stat().st_size
              print(f"OK: {model} ({size:,} bytes)")

          print("All GLB model headers are valid.")
          PY

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            SITE_URL=https://social.l3acler.com
            NEXT_PUBLIC_BACKEND_ORIGIN=
            NEXT_PUBLIC_BACKEND_WS_ORIGIN=
            NEXT_IMAGE_UNOPTIMIZED=true
          tags: |
            ghcr.io/hussainhht/spacial-network-frontend:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/hussainhht/Spacial-Network
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Build and publish backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/hussainhht/spacial-network-backend:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/hussainhht/Spacial-Network
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
