# The application and its npm lockfile live in frontend/.
# Reuse the demo pipeline instead of GitHub's root-level Next.js template.
name: Deploy Next.js site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  demo:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/livedemo'
    uses: ./.github/workflows/deploy-livedemo.yml
