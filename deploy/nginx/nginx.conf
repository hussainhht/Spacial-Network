worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    # Omit query strings, cookies, tokens and request bodies from access logs.
    log_format safe '$remote_addr $request_method $uri $status $body_bytes_sent';
    access_log /dev/stdout safe;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    # Loopback ingress is exclusively for cloudflared. Public HTTP must be
    # redirected to HTTPS at Cloudflare; applications always receive HTTPS.
    server {
        listen 8080;
        client_max_body_size 25m;
        client_body_timeout 60s;
        send_timeout 60s;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        location = /healthz {
            include /etc/nginx/proxy.conf;
            proxy_pass http://backend:8080/healthz;
        }
        location = /api/ws {
            include /etc/nginx/proxy.conf;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
            proxy_buffering off;
            proxy_pass http://backend:8080;
        }
        location /api/ {
            include /etc/nginx/proxy.conf;
            proxy_pass http://backend:8080;
        }
        location /uploads/ {
            include /etc/nginx/proxy.conf;
            proxy_pass http://backend:8080;
        }
        location / {
            include /etc/nginx/proxy.conf;
            proxy_pass http://frontend:3000;
        }
    }
}
